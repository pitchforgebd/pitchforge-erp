<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Pitchforge ERP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: dark ledger-teal rail with module navigation, sticky command bar, fluid content grid; wide tables scroll inside their own frames. */
:root{
  --bg:#F3F5F3; --surface:#FFFFFF; --surface-2:#ECF0EE; --line:#DCE2DF; --line-strong:#C6CFCB;
  --fg:#15211F; --muted:#5A6865; --faint:#86948F;
  --accent:#0B6E66; --accent-ink:#FFFFFF; --accent-soft:#DCEEEB;
  --rail:#0F1F1D; --rail-2:#162B28; --rail-fg:#D3E0DD; --rail-muted:#7F9893; --rail-active:#1E3D39; --rail-head:#FFFFFF;
  --good:#1D7A45; --good-soft:#E0F1E6; --warn:#9A5A00; --warn-soft:#FBEBD2; --crit:#B3261E; --crit-soft:#FBE2DF; --info:#235AA6; --info-soft:#E2EBF8;
  --chart-a:#0B6E66; --chart-b:#B9C6C2;
  --shadow:0 1px 2px rgba(16,32,30,.06),0 8px 24px rgba(16,32,30,.08);
  --scrim:rgba(10,20,18,.45);
  --f-display:"Archivo","IBM Plex Sans",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1413; --surface:#151D1C; --surface-2:#1B2624; --line:#263331; --line-strong:#33433F;
  --fg:#E2EBE8; --muted:#97A7A3; --faint:#6F807C;
  --accent:#3DB5A8; --accent-ink:#04211E; --accent-soft:#133935;
  --rail:#0A100F; --rail-2:#111B19; --rail-fg:#CFDCD9; --rail-muted:#71877F; --rail-active:#173430; --rail-head:#FFFFFF;
  --good:#4CC37E; --good-soft:#123020; --warn:#E4A24D; --warn-soft:#33240F; --crit:#F0766A; --crit-soft:#3A1714; --info:#81AAF0; --info-soft:#172541;
  --chart-a:#3DB5A8; --chart-b:#3A4A47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1413; --surface:#151D1C; --surface-2:#1B2624; --line:#263331; --line-strong:#33433F;
  --fg:#E2EBE8; --muted:#97A7A3; --faint:#6F807C;
  --accent:#3DB5A8; --accent-ink:#04211E; --accent-soft:#133935;
  --rail:#0A100F; --rail-2:#111B19; --rail-fg:#CFDCD9; --rail-muted:#71877F; --rail-active:#173430; --rail-head:#FFFFFF;
  --good:#4CC37E; --good-soft:#123020; --warn:#E4A24D; --warn-soft:#33240F; --crit:#F0766A; --crit-soft:#3A1714; --info:#81AAF0; --info-soft:#172541;
  --chart-a:#3DB5A8; --chart-b:#3A4A47;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:16px;font-weight:600}
h3{font-size:14px;font-weight:600}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:12.5px}
td.mono,td .mono,.tag{white-space:nowrap}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:2px;padding:16px 12px;z-index:50}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:16px;color:var(--rail-head)}
.brand-sub{font-size:11px;color:var(--rail-muted)}
.nav-group{padding:12px 10px 4px;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--rail-muted);font-weight:600}
.nav-item{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--rail-fg);text-decoration:none;font-weight:500;font-size:13.5px}
.nav-item:hover{background:var(--rail-2)}
.nav-item[aria-current="page"]{background:var(--rail-active);color:var(--rail-head);box-shadow:inset 2px 0 0 var(--accent)}
.nav-item svg{opacity:.85;flex:none}
.nav-count{margin-left:auto;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:600;padding:0 7px;border-radius:999px;line-height:18px}
.rail-foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--rail-2);font-size:11.5px;color:var(--rail-muted);line-height:1.45}
.rail-foot button{margin-top:8px;background:none;border:1px solid var(--rail-2);color:var(--rail-fg);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:11.5px}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:flex;align-items:center;gap:10px;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(clamp(16px,2.5vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.5vw,32px),env(safe-area-inset-right,0px))}
.icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;position:relative;flex:none;color:var(--fg)}
.icon-btn:hover{border-color:var(--line-strong)}
.dot{position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--crit);border:2px solid var(--surface)}
.menu-btn{display:none}
.search{position:relative;flex:1;max-width:460px;min-width:0}
.search input{width:100%;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);padding:0 12px 0 34px}
.search>svg{position:absolute;left:10px;top:10px;color:var(--faint)}
.search kbd{position:absolute;right:8px;top:8px;font-family:var(--f-mono);font-size:11px;color:var(--faint);border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--surface-2)}
.spacer{flex:1}
.role{display:flex;align-items:center;gap:8px;padding:3px 4px 3px 3px;border:1px solid var(--line);border-radius:999px;background:var(--surface)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:600;font-size:12px;flex:none}
.role select{border:0;background:transparent;font-weight:500;font-size:13px;padding-right:4px;cursor:pointer;max-width:170px}
.sample{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--warn);background:var(--warn-soft);padding:3px 8px;border-radius:999px;white-space:nowrap}
.content{width:100%;max-width:1480px;padding-block:24px 56px;padding-left:max(clamp(16px,2.5vw,32px),env(safe-area-inset-left,0px));padding-right:max(clamp(16px,2.5vw,32px),env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:20px}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head p{margin-top:4px;color:var(--muted);max-width:72ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-h p{margin-top:2px;color:var(--muted);font-size:12.5px}
.card-b{padding:16px}
.grid{display:grid;gap:16px}
.g-main{grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);align-items:start}
.g-half{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.kpi{padding:14px 16px;display:flex;flex-direction:column;gap:6px}
.kpi .label{font-size:12px;color:var(--muted);font-weight:500}
.kpi .value{font-family:var(--f-display);font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi .sub{font-size:12px;color:var(--muted)}
.up{color:var(--good);font-weight:600}.down{color:var(--crit);font-weight:600}.warnc{color:var(--warn);font-weight:600}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);background:var(--surface);font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--fg);text-decoration:none}
.btn:hover{background:var(--surface-2)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover{background:var(--accent);filter:brightness(1.07)}
.btn-danger{color:var(--crit)}
.btn-sm{height:28px;padding:0 9px;font-size:12.5px}
.btn[disabled]{opacity:.45;cursor:not-allowed;filter:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.pill.good{background:var(--good-soft);color:var(--good)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.crit{background:var(--crit-soft);color:var(--crit)}.pill.info{background:var(--info-soft);color:var(--info)}.pill.acc{background:var(--accent-soft);color:var(--accent)}
.tag{display:inline-flex;align-items:center;gap:4px;font-family:var(--f-mono);font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--surface-2);color:var(--muted);white-space:nowrap;text-decoration:none}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;padding:0 8px}
.tab{background:none;border:0;padding:10px 12px;font-weight:500;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-weight:600;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
.t-min{min-width:760px}
.bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;min-width:50px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px}
.bar.warn>i{background:var(--warn)}.bar.crit>i{background:var(--crit)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:flex-start;padding:12px 16px;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.li:last-child{border-bottom:0}
a.li:hover,.li.click:hover{background:var(--surface-2);cursor:pointer}
.li-ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;flex:none}
.li-ic.crit{background:var(--crit-soft);color:var(--crit)}.li-ic.warn{background:var(--warn-soft);color:var(--warn)}.li-ic.info{background:var(--info-soft);color:var(--info)}.li-ic.good{background:var(--good-soft);color:var(--good)}
.li-t{font-weight:500}
.li-s{font-size:12.5px;color:var(--muted)}
.li-r{margin-left:auto;text-align:right;flex:none}
.empty{padding:32px 16px;text-align:center;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.ch-grid{stroke:var(--line);stroke-width:1}
.ch-tick{fill:var(--faint);font-size:11px;font-family:var(--f-mono)}
.ch-lab{fill:var(--muted);font-size:11.5px;font-family:var(--f-body)}
.ch-val{fill:var(--fg);font-size:11.5px;font-weight:600;font-family:var(--f-mono)}
.ch-inc{fill:var(--chart-a)}.ch-exp{fill:var(--chart-b)}
.ch-part{opacity:.55}
.ch-fy{stroke:var(--line-strong);stroke-dasharray:3 3}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.split{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.kv{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;font-size:13px;margin:0}
.kv dt{color:var(--muted)}.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.nowrap{flex-wrap:nowrap}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--faint);font-size:12px}
.board{display:grid;grid-template-columns:repeat(4,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:4px}
.col{background:var(--surface-2);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 4px;font-weight:600;font-size:12.5px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.k-t{font-weight:500;line-height:1.35}
.k-m{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted);flex-wrap:wrap}
.k select{height:26px;font-size:12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:0 4px}
.ms{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);align-items:center}
.ms:last-child{border-bottom:0}
.ms-n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;border:1.5px solid var(--line-strong);color:var(--muted)}
.ms-n.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.ms-n.now{border-color:var(--accent);color:var(--accent)}
.je{border-bottom:1px solid var(--line)}
.je:last-child{border-bottom:0}
.je-h{display:grid;grid-template-columns:130px 70px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:12px 16px;cursor:pointer}
.je-h:hover{background:var(--surface-2)}
.je-lines{padding:0 16px 14px}
.je-lines .table-wrap{background:var(--surface-2);border-radius:8px}
.balanced{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:8px 2px 0;font-size:12px;color:var(--muted);flex-wrap:wrap}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:80;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);width:min(780px,100%);max-height:calc(100vh - 32px);display:flex;flex-direction:column;overflow:hidden}
.dialog-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:16px 18px;border-bottom:1px solid var(--line)}
.dialog-b{padding:16px 18px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.dialog-f{display:flex;justify-content:flex-end;gap:8px;padding:12px 18px;border-top:1px solid var(--line);flex-wrap:wrap;align-items:center}
.dialog-f .note{margin-right:auto;font-size:12.5px;color:var(--muted);max-width:52ch}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.wide{grid-column:1/-1}
.field label,.field .lbl{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,.cell{height:36px;border:1px solid var(--line-strong);border-radius:8px;background:var(--surface);padding:0 10px;width:100%}
.cell{height:32px;padding:0 8px}
.cell.n{text-align:right;font-variant-numeric:tabular-nums}
.field textarea{height:72px;padding:8px 10px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--faint)}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer}
.check input{margin-top:3px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.check.done{background:var(--good-soft);border-color:transparent}
.steps{display:flex;flex-direction:column}
.step{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;position:relative;padding-bottom:12px}
.step:last-child{padding-bottom:0}
.step::before{content:"";position:absolute;left:8px;top:18px;bottom:0;width:1.5px;background:var(--line)}
.step:last-child::before{display:none}
.step i{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line-strong);background:var(--surface);margin-top:2px}
.step.done i{background:var(--accent);border-color:var(--accent)}
.step.now i{border-color:var(--warn);background:var(--warn-soft)}
.step strong{font-weight:600}
.wiz{display:flex;gap:6px;flex-wrap:wrap}
.wiz span{font-size:12px;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--muted);font-weight:500}
.wiz span.on{background:var(--accent);color:var(--accent-ink)}
.wiz span.ok{background:var(--accent-soft);color:var(--accent)}
.callout{display:flex;gap:10px;padding:10px 12px;border-radius:8px;font-size:13px;align-items:flex-start}
.callout.crit{background:var(--crit-soft);color:var(--crit)}.callout.info{background:var(--info-soft);color:var(--info)}.callout.good{background:var(--good-soft);color:var(--good)}.callout.warn{background:var(--warn-soft);color:var(--warn)}
.callout svg{flex:none;margin-top:2px}
.pop{position:absolute;top:44px;right:0;width:min(380px,calc(100vw - 32px));max-height:70vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:70}
.pop-search{left:0;right:auto;width:100%}
.pop .li{cursor:pointer}
.pop .li:hover{background:var(--surface-2)}
.toasts{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:90;width:min(400px,calc(100vw - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:11px 14px;border-radius:10px;box-shadow:var(--shadow);font-size:13px;display:flex;gap:10px;align-items:flex-start;animation:tin .2s ease-out}
.toast.err{background:var(--crit);color:#fff}
.toast svg{flex:none;margin-top:2px}
@keyframes tin{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.mask{letter-spacing:.15em;color:var(--faint)}
.ts input{width:56px;height:30px;border:1px solid var(--line-strong);border-radius:6px;background:var(--surface);text-align:right;padding:0 6px;font-variant-numeric:tabular-nums}
.statement td.indent{padding-left:28px}
.statement tr.total td{font-weight:600;border-top:1.5px solid var(--line-strong)}
.statement tr.grand td{font-weight:700;font-size:14px;background:var(--accent-soft)}
.statement td.sec{padding-top:16px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.side-list{display:flex;flex-direction:column;padding:6px}
.side-list button{background:none;border:0;text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;color:var(--fg)}
.side-list button:hover{background:var(--surface-2)}
.side-list button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rep-grid{grid-template-columns:minmax(0,220px) minmax(0,1fr)}
.partner{display:flex;flex-direction:column;gap:12px;padding:16px}
.eq{font-family:var(--f-display);font-size:28px;font-weight:700;color:var(--accent)}
.rail-scrim{display:none}
.matrix td,.matrix th{text-align:center}
.matrix td:first-child,.matrix th:first-child{text-align:left}
@media (max-width:1100px){.g-main,.g-half{grid-template-columns:minmax(0,1fr)}}
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;inset:0 auto 0 0;width:min(288px,86vw);height:100%;transform:translateX(-102%);transition:transform .2s ease;padding-left:max(12px,env(safe-area-inset-left,0px));padding-top:max(16px,env(safe-area-inset-top,0px));padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
  .rail.open{transform:none}
  .rail-scrim.open{display:block;position:fixed;inset:0;background:var(--scrim);z-index:45}
  .menu-btn{display:inline-grid}
  .search kbd{display:none}
  .rep-grid{grid-template-columns:minmax(0,1fr)}
  .side-list{flex-direction:row;overflow-x:auto}
  .side-list button{white-space:nowrap}
}
@media (max-width:640px){
  .sample,.qa-label,#theme-btn,.role .avatar{display:none}
  .topbar{gap:8px}
  .topbar .btn-primary{padding:0 10px}
  .role{padding:3px 6px}
  .role select{max-width:92px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{padding:12px}
  .kpi .value{font-size:19px}
  .form,.form.three{grid-template-columns:minmax(0,1fr)}
  .je-h{grid-template-columns:minmax(0,1fr) auto;row-gap:4px}
  .je-h .je-date,.je-h .je-src{display:none}
  h1{font-size:21px}
}

/* Reversing a document's journal also restores the document, so sub-ledgers keep tying to the ledger. */
function undoSource(j){const m=j.meta;if(!m)return;
  if(m.type==='receipt'){const i=INVOICES.find(x=>x.no===m.inv);if(i){i.paid-=m.amt;if(i.status==='Paid')i.status='Sent';const p=PROJECTS.find(x=>x.code===i.project);if(p)p.collected-=m.amt;logAudit('Billing','Reopened',i.no,'receipt reversed by '+j.no);}}
  else if(m.type==='invoice'){const i=INVOICES.find(x=>x.no===m.inv);if(i){i.status='Cancelled';const p=PROJECTS.find(x=>x.code===i.project);if(p)p.invoiced-=i.net;logAudit('Billing','Cancelled',i.no,'invoice reversed by '+j.no);}}
  else if(m.type==='payrun'){m.bills.forEach(no=>{const b=BILLS.find(x=>x.no===no);if(b)b.status='Ready to pay';});for(let k=PAYMENTS.length-1;k>=0;k--)if(PAYMENTS[k].ref===m.pmt)PAYMENTS.splice(k,1);logAudit('Accounting','Reopened',m.pmt,'payment run reversed by '+j.no);}}
function doReverse(no){
  const j=JOURNALS.find(x=>x.no===no),why=val('rev-why');
  const nn=tryPost({date:val('rev-date'),src:no,desc:'Reversal of '+no+' · '+why.toLowerCase(),status:'Reversal',lines:j.lines.map(l=>[l[0],l[1],l[3],l[2]])});if(!nn)return;
  j.status='Reversed';undoSource(j);S.open={};S.open[nn]=true;logAudit('Accounting','Reversed',no,'reversal '+nn+' · '+why);toast('Posted <b>'+nn+'</b> reversing '+no+'.');closeModal();route();
}

});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modal-root').innerHTML)closeModal();$('#search-pop').hidden=true;$('#notif-pop').hidden=true;closeRail();}
  if(e.key==='/'&&!/input|textarea|select/i.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('.je-h')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  const id=e.target.id||'';
  if(id==='q')runSearch(e.target.value);
  if(id.indexOf('ts-')===0)tsTotals();
  if(id==='i-net'||id==='i-vat'||id==='i-proj')invPreview();
  if(id==='r-amt'){e.target.dataset.touched='1';rcpPreview();}
  if(id==='r-ait'||id==='r-vds'||id==='r-bank')rcpPreview();
  if(id.indexOf('jv-')===0)jvTotals();
  if(id.indexOf('np-w-')===0)npSum();
  if(id.indexOf('qt-')===0)qtCalc();
  if(id==='rq-q'||id==='rq-u')rqTot();
  if(id==='ds-res')dsPreview();
});
document.addEventListener('change',e=>{
  const t=e.target,id=t.id||'';
  if(id==='role'){S.role=t.value;S.tab.ap='waiting';store.set('pf-role',S.role);$('#avatar').textContent=me().ini;toast('Now viewing as <b>'+me().name+'</b> · '+me().title+'. Menu, data and actions follow this role.');route();return;}
  if(id==='audit-mod'){S.auditMod=t.value;route();return;}
  if(id==='payee-f'){S.payee=t.value;route();return;}
  if(id==='r-inv'){const a=$('#r-amt');if(a)delete a.dataset.touched;rcpFill();return;}
  if(id==='pr-bank'){const nos=Object.keys(S.paySel).filter(k=>S.paySel[k]&&BILLS.find(b=>b.no===k&&b.status==='Ready to pay'));$('#pr-table').innerHTML=payRunTable(payRunRows(nos,t.value),t.value);return;}
  if(id==='i-vat'||id==='i-proj'){invPreview();return;}
  if(id==='jv-date'||id.indexOf('jv-a-')===0){jvTotals();return;}
  if(t.dataset.pay){S.paySel[t.dataset.pay]=t.checked;route();return;}
  if(t.dataset.task){const k=TASKS.find(x=>x.id===t.dataset.task);logAudit('Projects','Updated',k.id,'status: '+k.st+' → '+t.value);k.st=t.value;toast('Task moved to '+t.value+'.');route();return;}
  if(t.dataset.doc){const p=t.dataset.doc.split('-');const tn=TENDERS[+p[0]];tn.docs[+p[1]][1]=t.checked?1:0;logAudit('CRM','Updated',tn.id,(t.checked?'ready: ':'not ready: ')+tn.docs[+p[1]][0]);tenderModal(+p[0]);route();return;}
});
window.addEventListener('hashchange',()=>{if($('#modal-root').innerHTML)$('#modal-root').innerHTML='';route();});

/* Boot */
const savedTheme=store.get('pf-theme');if(savedTheme==='dark'||savedTheme==='light')document.documentElement.setAttribute('data-theme',savedTheme);
const savedRole=store.get('pf-role');if(savedRole&&ROLES[savedRole])S.role=savedRole;
$('#role').value=S.role;$('#avatar').textContent=me().ini;themeIcon();route();
})();
</script>

</body>
</html>
